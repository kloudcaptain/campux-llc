name: Deploy to Cloudflare Workers (campux)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit fix
        run: npm audit fix || true

      - name: npm audit
        # next 16.2.x has no safe version within the advisory range — auto-fix above handles
        # what it can; block only on critical findings that have an available remediation.
        run: npm audit --audit-level=critical --omit=dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        continue-on-error: true
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
        continue-on-error: true

      - name: Run CodeQL analysis
        # Code scanning (SARIF upload) requires GitHub Advanced Security, which
        # isn't available on private repos on the free plan. Non-blocking so it
        # starts working automatically if GHAS is enabled or the repo goes public.
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: '/language:javascript-typescript'

  deploy:
    runs-on: ubuntu-latest
    needs: [security-scan]
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
